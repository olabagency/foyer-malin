name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les dépendances de test
        run: |
          pip install -r requirements_test.txt
          # Le paquet du frontend n'est pas tiré par Home Assistant : on prend la version qu'il attend.
          pip install "$(python -c "import json, pathlib, homeassistant.components.frontend as f; print(json.loads((pathlib.Path(f.__file__).parent / 'manifest.json').read_text())['requirements'][0])")"
      - name: Vérifier que la version est cohérente partout
        run: python scripts/check_version.py
      - name: Lancer les tests
        run: pytest -q
